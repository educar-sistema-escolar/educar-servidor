# Project selection is explicit in deploy/link commands; never infer a remote target.

# The handler validates the session with Auth getUser and requires an active
# superadmin. This supports signing keys beyond the gateway's legacy JWT check.
[functions.admin-provision-user]
verify_jwt = false
entrypoint = "./functions/admin-provision-user/index.ts"

# The gateway validates a JWT and the function checks its scheduler secret.
[functions.billing-reminders]
verify_jwt = true

[functions.billing-reminder-demo]
verify_jwt = true
